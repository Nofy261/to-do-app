

<div class="principal">
	<h1 class="title">My To-Do App</h1>
		<div class="add-task"> 
			<input [(ngModel)]="newTask" placeholder="Add new task">
			<button mat-button (click)="addTask()">ADD</button>
		</div>
	@for (task of tasks ?? []; track task; let i = $index) {
		<mat-card class="principal-card" appearance="outlined">
			<mat-card-content>

				@if (selectedTaskIndex === i) {
					<input 
						[(ngModel)]="editTaskTitle"
						placeholder="Edit task..."
					>
					<button (click)="saveTask(i)">SAVE</button>
				}
				@else {
					<p [class.done]="task.done">{{ task.title }}</p>
					<button mat-button (click)="updateTask(i)">UPDATE</button>
				}		
			</mat-card-content>
			<mat-card-actions>
				<button mat-button (click)="toggleDone(i)">DONE</button>
				<button mat-button (click)="deleteTask(i)">DELETE</button>
			</mat-card-actions>
		</mat-card>
	}
</div>
